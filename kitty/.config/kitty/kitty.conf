# ══════════════════════════════════════════════
#  KITTY — CYBERPUNK 2077 THEME
#  Palette: #f9f002 yellow | #0abdc6 cyan
#           #ea00d9 magenta | #ff003c red
#           #00ff9d green   | #00060e void
# ══════════════════════════════════════════════


# ── Font ──────────────────────────────────────
font_family      MonaspiceKr Nerd Font Mono
bold_font        MonaspiceKr Nerd Font Mono Bold
italic_font      MonaspiceKr Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0


# ── Scrollback ────────────────────────────────
scrollback_lines 10000


# ── URL ───────────────────────────────────────
url_style single


# ── Finestra ──────────────────────────────────
remember_window_size   yes
initial_window_width   120c
initial_window_height  35c
window_padding_width   10

# Trasparenza — Hyprland applica il blur automaticamente
background_opacity        0.82
dynamic_background_opacity yes


# ── Tab bar ───────────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     angled
tab_bar_min_tabs        1
tab_title_template      "  {index}: {title} "

active_tab_font_style   bold
inactive_tab_font_style normal


# ── Colori ────────────────────────────────────
include colors.conf


# ── Bell ──────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.0


# ── Misc ──────────────────────────────────────
shell_integration enabled
term              xterm-256color

# Remote control (per quick_access_terminal, broadcast, smart-splits)
allow_remote_control yes
listen_on             unix:@mykitty

# Fallback Nerd Font glyphs (Monaspice non copre tutta la PUA range)
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono

# Hyperlink underline su hover (kitten hyperlinked_grep)
underline_hyperlinks hover

# ── Caret CP2077 ──────────────────────────────────────────
cursor_shape                 beam
cursor_beam_thickness        2.0
cursor_blink_interval        0.5
cursor_stop_blinking_after   0

# Trail (smear effect) — soglia celle per attivare
cursor_trail                 3
cursor_trail_start_threshold 2

# decay: fast in, slow out (seconds)
cursor_trail_decay           0.1 0.4

# cyan netrunner
cursor_trail_color           #25e1ed

# ── Keybindings ───────────────────────────────

# Tab
map ctrl+t            new_tab
map ctrl+w            close_tab
map ctrl+tab          next_tab
map ctrl+shift+tab    previous_tab
map ctrl+shift+t      set_tab_title

# Finestre interne (split)
map ctrl+shift+enter  new_window
map ctrl+shift+w      close_window
map ctrl+shift+right  next_window
map ctrl+shift+left   previous_window

# Font size
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0

# Opacità al volo
map ctrl+shift+equal  set_background_opacity +0.05
map ctrl+shift+minus  set_background_opacity -0.05

# Copia / Incolla
map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard
