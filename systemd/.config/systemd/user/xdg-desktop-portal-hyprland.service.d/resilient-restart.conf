# At login the service can start before Hyprland finishes exposing the wlr
# protocols, exit 1, and (with the default ~100ms RestartSec) burn the start
# limit in a fraction of a second — then it stays dead and the portal frontend
# binds to a degraded ScreenCast backend (no screen-picker dialog).
# Disable the start limit and space retries so it patiently waits for the
# compositor instead of giving up.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=2
