screencopy {
    max_fps              = 60
    # Restore-token path su questo stack (portal-hyprland 1.3.12 + pipewire 1.6.6)
    # passa una stringa NULL a g_variant_new_string quando il token store accumula
    # voci con app-id vuoto (Discord non-sandbox) → risposta D-Bus corrotta, share
    # silenziosamente non parte. false = niente auto-token, il picker appare ogni
    # volta e il DB ~/.local/share/flatpak/db/screencast non si riaccumula. (2026-05-31)
    allow_token_by_default = false
}
